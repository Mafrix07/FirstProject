<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Professeur</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="main-container">
        <h2>Gestion des Notes</h2>
        <div id="welcome-message"></div>

        <form id="note-form">
            <div class="form-group">
                <label for="student-select">Choisir un élève</label>
                <select id="student-select" name="student-select" required></select>
            </div>
            <div class="form-group">
                <label>UE Enseignée</label>
                <div id="ue-display" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: #e9ecef;"></div>
            </div>
            <div class="form-group">
                <label for="note-input">Nouvelle note</label>
                <input type="number" id="note-input" name="note-input" min="0" max="20" step="0.5" required>
            </div>
            <div class="form-group">
                <label for="date-input">Date</label>
                <input type="date" id="date-input" name="date-input" required>
            </div>
            <button type="submit">Ajouter la note</button>
        </form>
        <p id="update-status"></p>

        <div class="student-info">
            <h3>Progression de l'élève</h3>
            <canvas id="progress-chart"></canvas>
        </div>
    </div>

    <script src="prof.js"></script>
</body>
</html>
