<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceuil-Etudiant</title>
    <link rel="stylesheet" href="style-inscription.css">
</head>
<body>
    <header>
        <div class="header-container">
           <div class="logoo"> <h1 class="logo">2M University</h1> </div>
          <div class="raccourci"> 
             <ul>
                <li><a class="lien" href="index.html">Se connecter</a></li>
                <li><a class="lien"  href="inscription.html">S'inscrire</a></li>
            </ul>
          </div>
        </div>

    </header>
   
 <div class="container">
    <div class="section_formulaire">
        <h2>S'inscrire </h2>
        <form action="">
            <div class="formulaire">
                <label for="email">Identifiant</label>
                <input type="email" placeholder="Exemple@gmail.com">
            </div>
         <div class="formulaire">  
                <label for="password">Mot de passe</label>
                <input type="password" placeholder="Mot de passe">
          </div> 
          <div class="formulaire">
            <label for="filiere">Filière</label>
            <select name="filiere" id="filiere">
                <option class="defaut" value="" selected disabled> --Choisissez votre filière--</option>
                <option value="DA">Developpement d'application</option>
                <option value="CS">Cyber-securité</option>
                <option value="IA">Intelligence artificielle</option>
                <option value="DS">Data-scientist</option>
            </select>
          </div>
          <div class="formulaire">
            <label for="niveau">Niveau</label>
            <select name="niveau" id="niveau">
                <option class="defaut" value="" selected disabled> --Choisissez votre niveau d'étude--</option>
                <option value="lp1">1ère année</option>
                <option value="lp2">2ème année</option>
                <option value="lp3">3ème année</option>
            </select>
          </div>
            <button type="submit" class="btn">S'inscrire</button>
        </form>
        <p class="texte">Vous avez déja un compte ? <a href="index.html">Se connecter</a></p>
    </div>
    
 </div>
</body>
</html>
